name: european_dream
description: "EUROPEAN DREAM - Track every step towards your European career."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # state management + DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # routing
  go_router: ^14.6.2

  # local persistence (offline-first)
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  shared_preferences: ^2.3.4
  supabase_flutter: ^2.10.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # ui
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.16

  # utils
  uuid: ^4.5.1
  collection: ^1.19.0
  csv: ^6.0.0
  file_saver: ^0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
